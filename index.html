<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="utf-8" />
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>TipOver (ThinkFun) — Peli</title>
<meta name="theme-color" content="#0F172A" />
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='96' fill='%230F172A'/%3E%3Cpath d='M128 320h256v32H128zM176 160h160v32H176zM240 208h32v144h-32z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./pwa_icon_180.png">
<style>
:root{
  --cell-base:84px; --scale:1; --cell:calc(var(--cell-base)*var(--scale)); --gap:8px;
  --bg:#0f172a; --panel:#111827; --ink:#f1f5f9; --muted:#94a3b8;
  --goal:#ef4444; --h2:#facc15; --h3:#22c55e; --h4:#3b82f6; --slab:#e5e7eb; --grid:#334155;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));
}
header{
  width:min(1100px,96vw);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
}
h1{font-size:1.05rem;margin:0;font-weight:800;letter-spacing:.2px;}
small.dim{color:var(--muted);}
.hud{
  width:min(1100px,96vw);
  background:var(--panel);border-radius:14px;padding:10px 12px;
  display:flex;flex-direction:column;gap:10px;
}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between;}
.left{display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
select,button,.pill{
  border-radius:10px;border:1px solid #334155;background:#0b1220;color:var(--ink);
  padding:10px 12px;font-weight:600;
}
button:disabled{opacity:.5;}
.pill{display:inline-flex;align-items:center;gap:8px;}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;}
.dot.g{background:var(--goal);} .dot.h2{background:var(--h2);} .dot.h3{background:var(--h3);} .dot.h4{background:var(--h4);}

.board-wrap{
  width:min(1100px,96vw);
  background:#0b1220;border:1px solid #1f2937;border-radius:16px;padding:14px;
  display:flex;align-items:center;justify-content:center;
}
.grid{
  display:grid; grid-template-columns:repeat(6,var(--cell)); grid-template-rows:repeat(6,var(--cell));
  gap:var(--gap); justify-content:center; align-content:center; touch-action:none;
}
.cell{
  width:var(--cell);height:var(--cell);border-radius:12px;position:relative;overflow:hidden;
  background:#0b1220;outline:1px solid var(--grid);
}
.mark{
  position:absolute;inset:0;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:22px;letter-spacing:.5px;user-select:none;text-shadow:0 1px 0 rgba(0,0,0,.4);
}
.u1{background:var(--goal);color:white;}
.u2{background:var(--h2);color:black;}
.u3{background:var(--h3);color:black;}
.u4{background:var(--h4);color:white;}
.slab{background:var(--slab);color:#111;font-weight:700;font-size:16px;}
.slab::after{content:'';position:absolute;inset:10px;border-radius:10px;border:2px dashed #cbd5e1;opacity:.6;}
.player{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2;
}
.player>div{
  width:42%;height:42%;border-radius:999px;background:linear-gradient(180deg,#38bdf8,#0284c7);
  box-shadow:0 0 0 3px white,0 2px 10px rgba(0,0,0,.5);
}

.status{color:#e5e7eb;font-size:.95rem;padding:.5rem .75rem;background:#0b1220;border:1px solid #334155;border-radius:10px;}
.success{border-color:#065f46;} .warn{border-color:#854d0e;} .err{border-color:#7f1d1d;}

@media (max-width:480px){ :root{ --cell-base:68px; --gap:6px; } }
</style>
</head>
<body>
  <header>
    <h1>TipOver — Peli (ThinkFun, alkuperäiset säännöt)</h1>
    <small class="dim">Ladataan aina: <code>tipover_pulmat.json</code></small>
  </header>

  <div class="hud">
    <!-- Rivi 1: valinta + Seuraava, Aloita alusta, Peru -->
    <div class="row">
      <div class="left">
        <label class="pill">Pulma:
          <select id="puzzleSelect"></select>
        </label>
        <button id="btnNext">Seuraava ▶</button>
        <button id="btnRestart">Aloita alusta</button>
        <button id="btnUndo" title="Peru viimeisin siirto/kaato (Esc)">Peru</button>
      </div>
    </div>

    <!-- Rivi 2: pelkkä legendi ja heti perään status -->
    <div class="row">
      <div class="left">
        <span class="pill"><span class="dot g"></span> Goal</span>
        <span class="pill"><span class="dot h2"></span> 2</span>
        <span class="pill"><span class="dot h3"></span> 3</span>
        <span class="pill"><span class="dot h4"></span> 4</span>
        <div id="status" class="status">Ladataan pulmia…</div>
      </div>
    </div>
  </div>

  <div class="board-wrap">
    <div class="grid" id="grid" aria-label="pelilauta 6x6" tabindex="0"></div>
  </div>

<script src="./app.js"></script>
<script>
function measureAndSetCell(){
  const vw=Math.max(320,window.innerWidth), vh=Math.max(320,window.innerHeight);
  const boardMaxW=Math.min(1100,vw*0.96), boardMaxH=Math.min(vh*0.78,900);
  const gap=8, cols=6, rows=6;
  const sizeW=(boardMaxW-14*2-gap*(cols-1))/cols;
  const sizeH=(boardMaxH-14*2-gap*(rows-1))/rows;
  const cell=Math.floor(Math.max(52,Math.min(sizeW,sizeH)));
  document.documentElement.style.setProperty('--scale', String(cell/84));
}
measureAndSetCell();
window.addEventListener('resize',measureAndSetCell);
window.addEventListener('orientationchange',measureAndSetCell);

if('serviceWorker'in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
}
</script>
</body>
</html>
